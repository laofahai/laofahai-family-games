services:
  pocketbase:
    image: family-games-pocketbase:latest
    container_name: family-games-pocketbase
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
    volumes:
      - ./pb_data:/pb/pb_data
    expose:
      - "8080"
    networks:
      - nestory-net

networks:
  nestory-net:
    external: true
