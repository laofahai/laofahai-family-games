name: Deploy to nestory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestory
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate PocketBase content seed
        run: node scripts/export-pocketbase-content.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          BASE_URL: /
          VITE_POCKETBASE_URL: https://pb.902.linch.tech
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: nestory
      url: https://game.902.linch.tech
    env:
      APP_DIR: /opt/family-games
      DOMAIN: game.902.linch.tech
      NESTORY_SSH_HOST: ${{ secrets.NESTORY_SSH_HOST }}
      NESTORY_SSH_PORT: ${{ secrets.NESTORY_SSH_PORT }}
      NESTORY_SSH_USER: ${{ secrets.NESTORY_SSH_USER }}
      NESTORY_SSH_KEY: ${{ secrets.NESTORY_SSH_KEY }}
      VITE_POCKETBASE_URL: https://pb.902.linch.tech
      LIVEKIT_URL: wss://rtc.902.linch.tech
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
      PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check SSH secrets
        run: |
          set -euo pipefail
          test -n "$NESTORY_SSH_HOST"
          test -n "$NESTORY_SSH_PORT"
          test -n "$NESTORY_SSH_USER"
          test -n "$NESTORY_SSH_KEY"
          test -n "$LIVEKIT_API_KEY"
          test -n "$LIVEKIT_API_SECRET"

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$NESTORY_SSH_KEY" > ~/.ssh/nestory_deploy
          chmod 600 ~/.ssh/nestory_deploy
          ssh-keyscan -p "$NESTORY_SSH_PORT" "$NESTORY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Package source
        run: |
          set -euo pipefail
          npm ci
          node scripts/export-pocketbase-content.mjs
          BASE_URL=/ VITE_POCKETBASE_URL="$VITE_POCKETBASE_URL" npm run build
          docker build --platform linux/amd64 -t family-games-pocketbase:latest -f deploy/family-games-pocketbase/Dockerfile .
          docker pull livekit/livekit-server:latest
          docker pull redis:7-alpine
          docker save family-games-pocketbase:latest livekit/livekit-server:latest redis:7-alpine | gzip > /tmp/family-games-images.tar.gz
          tar -czf /tmp/family-games-dist.tgz -C dist .

      - name: Upload deploy files
        run: |
          set -euo pipefail
          printf 'VITE_POCKETBASE_URL=%s\nPB_ADMIN_EMAIL=%s\nPB_ADMIN_PASSWORD=%s\nLIVEKIT_URL=%s\nLIVEKIT_API_KEY=%s\nLIVEKIT_API_SECRET=%s\n' "$VITE_POCKETBASE_URL" "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD" "$LIVEKIT_URL" "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" > /tmp/family-games.env
          ssh -i ~/.ssh/nestory_deploy -p "$NESTORY_SSH_PORT" "$NESTORY_SSH_USER@$NESTORY_SSH_HOST" "mkdir -p '$APP_DIR' /opt/nestory/caddy/sites"
          scp -i ~/.ssh/nestory_deploy -P "$NESTORY_SSH_PORT" /tmp/family-games-dist.tgz "$NESTORY_SSH_USER@$NESTORY_SSH_HOST:/tmp/family-games-dist.tgz"
          scp -i ~/.ssh/nestory_deploy -P "$NESTORY_SSH_PORT" /tmp/family-games-images.tar.gz "$NESTORY_SSH_USER@$NESTORY_SSH_HOST:/tmp/family-games-images.tar.gz"
          scp -i ~/.ssh/nestory_deploy -P "$NESTORY_SSH_PORT" /tmp/family-games.env "$NESTORY_SSH_USER@$NESTORY_SSH_HOST:/tmp/family-games.env"
          scp -i ~/.ssh/nestory_deploy -P "$NESTORY_SSH_PORT" deploy/family-games-web/docker-compose.yml "$NESTORY_SSH_USER@$NESTORY_SSH_HOST:$APP_DIR/docker-compose.yml"
          scp -i ~/.ssh/nestory_deploy -P "$NESTORY_SSH_PORT" deploy/family-games-web/game-902.caddy "$NESTORY_SSH_USER@$NESTORY_SSH_HOST:/tmp/game-902.caddy"

      - name: Deploy container and Caddy site
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nestory_deploy -p "$NESTORY_SSH_PORT" "$NESTORY_SSH_USER@$NESTORY_SSH_HOST" "
            set -euo pipefail
            cd '$APP_DIR'
            rm -rf /opt/nestory/caddy/site/game-902.new
            mkdir -p releases /opt/nestory/caddy/site/game-902.new
            tar -xzf /tmp/family-games-dist.tgz -C /opt/nestory/caddy/site/game-902.new
            if [ -d /opt/nestory/caddy/site/game-902 ]; then
              mv /opt/nestory/caddy/site/game-902 releases/site-\$(date +%Y%m%d%H%M%S)
            fi
            mv /opt/nestory/caddy/site/game-902.new /opt/nestory/caddy/site/game-902
            mv /tmp/family-games.env .env
            chmod 600 .env
            set -a
            . ./.env
            set +a
            cat > livekit.yaml <<EOF
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: family-games-redis:6379
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
EOF
            chmod 600 livekit.yaml
            docker load -i /tmp/family-games-images.tar.gz
            docker compose --env-file .env up -d --no-build --remove-orphans
            rm -f /opt/nestory/caddy/sites/902-family.caddy
            cp /tmp/game-902.caddy /opt/nestory/caddy/sites/game-902.caddy
            cd /opt/nestory/caddy
            docker compose up -d --force-recreate
            docker image prune -f
          "

      - name: Verify deployment
        run: |
          set -euo pipefail
          test "$(curl -fsS "https://$DOMAIN/health")" = "ok"
          test "$(curl -fsS "https://pb.902.linch.tech/health")" = '{"ok":true}'
