name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Supabase migrations
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply party content expansion
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed/party-content-expansion.sql

  build:
    runs-on: ubuntu-latest
    needs: database
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          # 在仓库 Settings → Secrets 添加这两项，线上站点才会启用云端
          # （设备解锁门 / 邀请码 / 个人进度同步 / 远程协作）。不加则线上为纯本地、零门槛。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
